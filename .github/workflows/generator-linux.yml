name: Generator Linux

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Build token (from server)'
        required: true
        type: string
      genurl:
        description: 'API server base URL'
        required: false
        type: string
      version:
        description: 'RustDesk version tag (e.g. 1.4.6) or "master"'
        required: false
        default: 'master'
        type: string

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  # Disable vcpkg binary caching — the x-gha backend requires
  # ACTIONS_CACHE_URL which is only accessible via the Actions runtime API
  # (not the bash environment), making it unreliable. Building from source
  # adds ~10 min but is fully reliable within the 150-min timeout.
  VCPKG_BINARY_SOURCES: "clear"
  VERSION: "${{ inputs.version || 'master' }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version || 'master' }}

  build-linux:
    name: Build Linux x86_64
    needs: generate-bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch build params
        id: params
        shell: bash
        run: |
          GENURL="${{ inputs.genurl || secrets.GENURL }}"
          TOKEN="${{ inputs.token }}"

          RESPONSE=$(curl -s -f "${GENURL}/admin/client-build/get-params?token=${TOKEN}") || {
            echo "Failed to fetch build params from ${GENURL}"
            exit 1
          }

          echo "APP_NAME=$(echo $RESPONSE | jq -r '.app_name')"              >> $GITHUB_ENV
          echo "COMPANY_NAME=$(echo $RESPONSE | jq -r '.company_name')"      >> $GITHUB_ENV
          echo "FILE_NAME=$(echo $RESPONSE | jq -r '.file_name')"            >> $GITHUB_ENV
          echo "RDSERVER=$(echo $RESPONSE | jq -r '.server')"                >> $GITHUB_ENV
          echo "RDKEY=$(echo $RESPONSE | jq -r '.key')"                      >> $GITHUB_ENV
          echo "API_SERVER=$(echo $RESPONSE | jq -r '.api_server')"          >> $GITHUB_ENV
          echo "ICON_URL=$(echo $RESPONSE | jq -r '.icon_url // ""')"        >> $GITHUB_ENV
          echo "BUILD_TOKEN=${TOKEN}"                                         >> $GITHUB_ENV
          echo "GENURL_VALUE=${GENURL}"                                       >> $GITHUB_ENV

          CUSTOM=$(echo $RESPONSE | jq -r '.custom_config // "{}"')
          echo "ENABLE_AGENT=$(echo $CUSTOM | jq -r '.enable_agent // true')" >> $GITHUB_ENV
          echo "SERVICE_KEY=$(echo $RESPONSE | jq -r '.service_key // ""')"   >> $GITHUB_ENV
          echo "IS_GENERIC=$(echo $RESPONSE | jq -r '.is_generic // false')"  >> $GITHUB_ENV

      - name: Save agent files before RustDesk checkout
        if: env.ENABLE_AGENT == 'true'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/everty-agent
          cp .github/agent/agent_service.dart /tmp/everty-agent/agent_service.dart
          printf "const String kAgentApiServer = '%s';\nconst String kAgentServiceKey = '%s';\nconst bool kIsGenericClient = %s;\n" "${API_SERVER}" "${SERVICE_KEY}" "${IS_GENERIC}" > /tmp/everty-agent/agent_constants.dart

      - name: Report running
        shell: bash
        run: |
          curl -s -X POST "${GENURL_VALUE}/admin/client-build/webhook/update?token=${BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"running\",\"run_id\":${GITHUB_RUN_ID},\"progress\":\"Linux: установка зависимостей...\"}"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl g++ gcc-multilib git imagemagick jq \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev libgtk-3-dev \
            libpam0g-dev libpulse-dev libunwind-dev libva-dev libvdpau-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev \
            libxfixes-dev llvm-dev nasm ninja-build pkg-config wget dpkg-dev

      - name: Checkout RustDesk source (tag)
        if: env.VERSION != 'master'
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout RustDesk source (master)
        if: env.VERSION == 'master'
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Inject Smart Agent
        if: env.ENABLE_AGENT == 'true'
        continue-on-error: true
        shell: bash
        run: |
          cp /tmp/everty-agent/agent_service.dart ./flutter/lib/agent_service.dart
          cp /tmp/everty-agent/agent_constants.dart ./flutter/lib/agent_constants.dart

          sed -i "1s|^|import 'package:flutter_hbb/agent_service.dart';\nimport 'package:flutter_hbb/agent_constants.dart';\n|" ./flutter/lib/main.dart
          sed -i "s|WidgetsFlutterBinding.ensureInitialized();|WidgetsFlutterBinding.ensureInitialized();\n  AgentService.instance.initialize(apiServer: kAgentApiServer, serviceKey: kAgentServiceKey, isGenericClient: kIsGenericClient).ignore();|" ./flutter/lib/main.dart
          # NOTE: navigatorKey is NOT overridden. RustDesk's Get.dialog /
          # Get.snackbar rely on Get.key being attached to the live Navigator;
          # rewriting it broke the Sign-in dialog. AgentService uses its
          # own widget-tree walker (_findContext) so its dialogs still work.
          # Support-request button: inject after stable anchor buildTip(context).
          # CRITICAL: also inject the AgentService import at the top of the file.
          if [ -f ./flutter/lib/desktop/pages/desktop_home_page.dart ]; then
            sed -i "1s|^|import 'package:flutter_hbb/agent_service.dart';\n|" ./flutter/lib/desktop/pages/desktop_home_page.dart
            sed -i "s|buildTip(context),|buildTip(context),\n      Padding(padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8), child: TextButton.icon(icon: const Icon(Icons.support_agent, size: 20), label: const Text('Запросить помощь'), style: TextButton.styleFrom(foregroundColor: const Color(0xFF2563EB)), onPressed: () => AgentService.instance.showSupportRequestDialog(context),),),|" ./flutter/lib/desktop/pages/desktop_home_page.dart || true
            echo "✓ Support-request button injected into desktop_home_page.dart"
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          # doNotCache=true stops run-vcpkg from trying to save/restore the
          # vcpkg tool itself via actions/cache — avoids 400 "service unavailable"
          # errors from GitHub's cache API for the tool layer.
          # Binary packages are still cached through VCPKG_BINARY_SOURCES (x-gha).
          doNotCache: true

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet x64-linux \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-lib-cache-linux

      - name: Patch icon
        if: env.ICON_URL != ''
        continue-on-error: true
        shell: bash
        run: |
          wget -T 30 -t 2 -O ./res/icon.png "${ICON_URL}"
          convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico || true
          convert ./res/icon.png -resize 32x32 ./res/32x32.png || true
          convert ./res/icon.png -resize 64x64 ./res/64x64.png || true
          convert ./res/icon.png -resize 128x128 ./res/128x128.png || true
          convert ./res/128x128.png -resize 200% ./res/128x128@2x.png || true

      - name: Replace Flutter icons
        if: env.ICON_URL != ''
        continue-on-error: true
        run: |
          pushd ./flutter
          flutter pub get
          dart run flutter_launcher_icons
          popd

      - name: Set server, key, and API server
        continue-on-error: true
        shell: bash
        run: |
          [ -n "${RDSERVER}" ]   && sed -i -e "s|rs-ny.rustdesk.com|${RDSERVER}|" ./libs/hbb_common/src/config.rs
          [ -n "${RDKEY}" ]      && sed -i -e "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${RDKEY}|" ./libs/hbb_common/src/config.rs
          [ -n "${API_SERVER}" ] && sed -i -e "s|https://admin.rustdesk.com|${API_SERVER}|" ./src/common.rs

      - name: Rename app
        if: env.APP_NAME != '' && env.APP_NAME != 'rustdesk'
        continue-on-error: true
        shell: bash
        run: |
          find ./src/lang -name "*.rs" -exec sed -i "s|RustDesk|${APP_NAME}|g" {} \;
          sed -i "s|title: 'RustDesk'|title: '${APP_NAME}'|" ./flutter/lib/main.dart
          [ -n "${COMPANY_NAME}" ] && find ./src/lang -name "*.rs" -exec sed -i "/powered_by_me/s|RustDesk|${COMPANY_NAME}|g" {} \; || true
          # Patch APP_NAME in hbb_common — controls config folder and app data paths
          sed -i -e "s|pub const APP_NAME: \&str = \"RustDesk\";|pub const APP_NAME: \&str = \"${APP_NAME}\";|" ./libs/hbb_common/src/config.rs || true
          # Also override get_app_name() body in src/common.rs (reliable: lives in our repo)
          sed -i "s|hbb_common::config::APP_NAME.read().unwrap().clone()|\"${APP_NAME}\".to_string()|g" ./src/common.rs || true
          if [ -f ./libs/hbb_common/src/config.rs ]; then
            sed -i -E "s|RwLock::new\(\"RustDesk\".to_owned\(\)\)|RwLock::new(\"${APP_NAME}\".to_owned())|g" ./libs/hbb_common/src/config.rs || true
          fi
          sed -i -e "s|\"RustDesk\"|\"${APP_NAME}\"|g" ./libs/hbb_common/src/config.rs || true

      - name: Fix connection delay (address book)
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|!key.is_empty()|false|' ./src/client.rs

      - name: Report progress - building
        shell: bash
        run: |
          curl -s -X POST "${GENURL_VALUE}/admin/client-build/webhook/update?token=${BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"progress":"Linux: компилируется (Rust + Flutter, ~40-70 мин)..."}'

      - name: Check disk and memory before build
        shell: bash
        run: |
          echo "=== Disk ===" && df -h /
          echo "=== RAM ===" && free -h

      - name: Enable Flutter Linux desktop
        shell: bash
        run: |
          flutter config --enable-linux-desktop
          flutter --version

      - name: Build Linux DEB
        shell: bash
        run: |
          export VCPKG_ROOT=/opt/artifacts/vcpkg
          # Stream output live via tee so errors are visible immediately.
          # build.py may print "False" from partial packaging steps even when
          # the actual binary was built — don't rely on text parsing.
          python3 -u build.py --flutter 2>&1 | tee /tmp/build_out.txt || true
          # Verify the actual build artifact, not build.py's printed return value.
          if [ ! -f "flutter/build/linux/x64/release/bundle/rustdesk" ]; then
            echo "::error::Build failed — flutter binary not found at flutter/build/linux/x64/release/bundle/rustdesk"
            exit 1
          fi
          echo "✓ Flutter binary found"

      - name: Rename DEB
        shell: bash
        run: |
          FNAME="${FILE_NAME:-rustdesk}"
          # build.py creates rustdesk.deb in the repo root (or flutter/).
          DEB=$(find . -maxdepth 3 -name "*.deb" | grep -v vcpkg | grep -v apt | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb found after build — listing deb candidates:"
            find . -name "*.deb" 2>/dev/null || true
            exit 1
          fi
          cp "$DEB" "${FNAME}.deb"
          echo "✓ ${FNAME}.deb ready ($(du -sh "${FNAME}.deb" | cut -f1))"

      - name: Report progress - uploading
        shell: bash
        run: |
          curl -s -X POST "${GENURL_VALUE}/admin/client-build/webhook/update?token=${BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"progress":"Linux: загружается на сервер..."}'

      - name: Upload DEB to server
        shell: bash
        run: |
          FNAME="${FILE_NAME:-rustdesk}"
          curl -s -f -X POST \
            "${GENURL_VALUE}/admin/client-build/webhook/save?token=${BUILD_TOKEN}" \
            -F "file=@${FNAME}.deb"
          echo "Uploaded ${FNAME}.deb"

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          curl -s -X POST "${GENURL_VALUE}/admin/client-build/webhook/update?token=${BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"message\":\"Ошибка сборки Linux. Logs: https://github.com/${{ github.repository }}/actions/runs/${GITHUB_RUN_ID}\"}"
