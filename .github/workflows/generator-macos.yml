      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet arm64-osx \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }}
          rustup default ${{ env.RUST_VERSION }}
          rustup target add aarch64-apple-darwin
          rustup component add rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rustdesk-lib-cache-macos-arm

      - name: Patch icon
        if: env.ICON_URL != ''
        continue-on-error: true
        shell: bash
        run: |
          curl -fsSL "${ICON_URL}" -o ./res/icon.png || wget -T 30 -t 2 -O ./res/icon.png "${ICON_URL}"
          convert ./res/icon.png -resize 32x32 ./res/32x32.png || true
          convert ./res/icon.png -resize 64x64 ./res/64x64.png || true
          convert ./res/icon.png -resize 128x128 ./res/128x128.png || true
          convert ./res/128x128.png -resize 200% ./res/128x128@2x.png || true

